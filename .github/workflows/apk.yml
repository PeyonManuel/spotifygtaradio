name: Build Android APK

# Builds a small Android app that simply opens your GitHub Pages site (so updating the site updates the app).
# Run it from the repo's Actions tab ("Run workflow"), then download app-debug.apk from the Releases page.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-wrapper/**", ".github/workflows/apk.yml", "icon-512.png"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Create the Android project
        working-directory: android-wrapper
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = "android-wrapper/android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)   # use plain PNG icons instead of the default adaptive icon
          src = Image.open("icon-512.png").convert("RGBA")
          for d, size in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              folder = f"{res}/mipmap-{d}"
              if not os.path.isdir(folder): continue
              icon = src.resize((size, size), Image.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  icon.save(f"{folder}/{name}")
          PY
      - name: Build debug APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleDebug
      - name: Rename
        run: cp android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk ManuFM.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GTA Spotify Radio APK ${{ github.run_number }}
          files: ManuFM.apk
